<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACE.SLOT — 얼굴 랜덤 돌리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0c;
    --card: #111513;
    --line: #1f2823;
    --green: #39ff88;
    --green-dim: #1c7a42;
    --text: #d7e3dc;
    --dim: #6b7c73;
    --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .08em; color: var(--green); }
  h1 span { color: var(--dim); font-weight: 400; }
  .sub { color: var(--dim); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--dim); letter-spacing: .12em; }
  .card h2 b { color: var(--green); font-weight: 700; margin-right: 8px; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
    cursor: pointer; transition: border-color .15s, color .15s, background .15s;
  }
  button:hover:not(:disabled), .btn:hover { border-color: var(--green-dim); color: var(--green); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn input { display: none; }

  .stage { margin-top: 12px; display: none; }
  .stage.on { display: block; }
  .stage img, .stage video {
    width: 100%; max-height: 360px; object-fit: contain;
    background: #070908; border: 1px solid var(--line); border-radius: 8px; display: block;
  }
  video { transform: scaleX(-1); }

  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--dim); }
  .consent input { margin-top: 4px; accent-color: var(--green); }

  /* slot machine */
  .reels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .reel-name { font-size: 11px; color: var(--dim); margin-bottom: 4px; letter-spacing: .08em; }
  .window {
    height: 64px; border: 1px solid var(--line); border-radius: 8px; background: #070908;
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.6), inset 0 -8px 14px rgba(0,0,0,.6);
  }
  .face { font-size: 14px; text-align: center; padding: 0 6px; }
  .face.idle { color: var(--dim); }
  .face.spinning { color: var(--green); filter: blur(1.2px); }
  .face.tick { animation: tick .08s linear; }
  @keyframes tick { from { transform: translateY(-70%); opacity: .3; } to { transform: translateY(0); opacity: 1; } }
  .face.locked { color: var(--green); font-weight: 700; animation: lock .35s ease-out; }
  .window:has(.locked) { border-color: var(--green-dim); box-shadow: 0 0 14px rgba(57,255,136,.18), inset 0 8px 14px rgba(0,0,0,.6), inset 0 -8px 14px rgba(0,0,0,.6); }
  @keyframes lock { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .spin {
    width: 100%; margin-top: 14px; padding: 16px; font-size: 16px; font-weight: 700;
    color: #04130a; background: var(--green); border: none; letter-spacing: .06em;
  }
  .spin:hover:not(:disabled) { background: #66ffa6; color: #04130a; }
  .spin:disabled { background: var(--line); color: var(--dim); }
  .hint { margin-top: 10px; font-size: 12px; color: var(--dim); }
  .error { margin-top: 10px; color: var(--warn); font-size: 13px; display: none; }
  .banner { border: 1px dashed var(--green-dim); color: var(--green); border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 14px; display: none; }

  /* result */
  .result { display: none; }
  .result.on { display: block; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare figure { margin: 0; position: relative; }
  .compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border: 1px solid var(--line); border-radius: 8px; background: #070908; display: block; }
  .compare figcaption { font-size: 11px; color: var(--dim); margin-top: 6px; letter-spacing: .08em; }
  .badge {
    position: absolute; right: 8px; bottom: 34px; font-size: 10px; letter-spacing: .08em;
    background: rgba(0,0,0,.6); color: var(--green); border: 1px solid var(--green-dim);
    border-radius: 4px; padding: 2px 6px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .tag { border: 1px solid var(--green-dim); color: var(--green); border-radius: 999px; padding: 2px 10px; font-size: 12px; }

  footer { color: var(--dim); font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FACE<span>.</span>SLOT</h1>
    <div class="sub">가상의 얼굴 랜덤 돌리기</div>
  </header>

  <div class="banner" id="mockBanner">모의 모드: 서버에 GEMINI_API_KEY가 없어 원본 사진이 그대로 나옵니다. 연출 확인용이에요.</div>

  <section class="card">
    <h2><b>01</b>얼굴 사진</h2>
    <div class="row">
      <label class="btn">사진 첨부<input type="file" id="fileInput" accept="image/*"></label>
      <button id="camBtn" type="button">카메라 켜기</button>
    </div>

    <div class="stage" id="camStage">
      <video id="video" autoplay playsinline muted></video>
      <div class="row" style="margin-top:8px">
        <button id="shotBtn" type="button">촬영</button>
        <button id="camClose" type="button">닫기</button>
      </div>
    </div>

    <div class="stage" id="previewStage">
      <img id="preview" alt="선택한 사진 미리보기">
    </div>
  </section>

  <section class="card">
    <h2><b>02</b>슬롯</h2>
    <div class="reels" id="reels"></div>

    <label class="consent" style="margin-top:14px">
      <input type="checkbox" id="consent">
      <span>본인 사진, 또는 사용을 허락받은 사진만 올립니다. 결과는 실존하지 않는 AI 생성 얼굴임을 이해했습니다.</span>
    </label>

    <button class="spin" id="spinBtn" type="button" disabled>얼굴 랜덤 돌리기</button>
    <div class="hint" id="hint">사진을 고르고 동의에 체크하면 버튼이 켜집니다.</div>
    <div class="error" id="error"></div>
  </section>

  <section class="card result" id="result">
    <h2><b>03</b>결과</h2>
    <div class="compare">
      <figure>
        <img id="beforeImg" alt="원본">
        <figcaption>BEFORE</figcaption>
      </figure>
      <figure>
        <img id="afterImg" alt="결과">
        <span class="badge">AI 생성</span>
        <figcaption>AFTER</figcaption>
      </figure>
    </div>
    <div class="tags" id="tags"></div>
    <div class="row">
      <button id="againBtn" type="button">같은 사진으로 다시 돌리기</button>
      <button id="dlBtn" type="button">저장</button>
    </div>
  </section>

  <footer>
    업로드한 사진은 서버에 저장하지 않고 처리 직후 폐기합니다. 다만 얼굴 변환을 위해 이미지 생성 API로 전송됩니다.
    저장되는 결과 이미지에는 "AI GENERATED" 표시가 들어갑니다.
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const fileInput = $("#fileInput"), camBtn = $("#camBtn"), camStage = $("#camStage"),
      video = $("#video"), shotBtn = $("#shotBtn"), camClose = $("#camClose"),
      previewStage = $("#previewStage"), preview = $("#preview"),
      consent = $("#consent"), spinBtn = $("#spinBtn"), hint = $("#hint"), errorEl = $("#error"),
      resultEl = $("#result"), beforeImg = $("#beforeImg"), afterImg = $("#afterImg"),
      tagsEl = $("#tags"), againBtn = $("#againBtn"), dlBtn = $("#dlBtn");

let photo = null;       // File | Blob
let photoURL = null;
let stream = null;
let busy = false;
let reelNames = [];
let reelPools = {};
let faceEls = [];
const timers = [];

/* ---------- 초기화 ---------- */
async function init() {
  const opt = await (await fetch("/api/options")).json();
  reelPools = opt.reels;
  reelNames = Object.keys(reelPools);
  const box = $("#reels");
  reelNames.forEach((name) => {
    const cell = document.createElement("div");
    const label = document.createElement("div");
    label.className = "reel-name"; label.textContent = name;
    const win = document.createElement("div"); win.className = "window";
    const face = document.createElement("div"); face.className = "face idle"; face.textContent = "?";
    win.appendChild(face); cell.append(label, win); box.appendChild(cell);
    faceEls.push(face);
  });
  try {
    const h = await (await fetch("/api/health")).json();
    if (h.mock) $("#mockBanner").style.display = "block";
  } catch (_) {}
  refreshUI();
}

/* ---------- 사진 입력 ---------- */
function setPhoto(blob) {
  if (photoURL) URL.revokeObjectURL(photoURL);
  photo = blob;
  photoURL = URL.createObjectURL(blob);
  preview.src = photoURL;
  previewStage.classList.add("on");
  resultEl.classList.remove("on");
  resetReels();
  hideError();
  refreshUI();
}

fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];
  if (f) { closeCamera(); setPhoto(f); }
  fileInput.value = "";
});

camBtn.addEventListener("click", async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("이 브라우저에서는 카메라를 쓸 수 없어요. 사진 첨부를 이용해주세요.");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    video.srcObject = stream;
    camStage.classList.add("on");
    hideError();
  } catch (e) {
    showError("카메라 권한이 필요해요. 브라우저 설정에서 허용하거나 사진 첨부를 이용해주세요.");
  }
});

function closeCamera() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null;
  camStage.classList.remove("on");
}
camClose.addEventListener("click", closeCamera);

shotBtn.addEventListener("click", () => {
  if (!video.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(video, 0, 0);          // 서버에는 거울 반전 없는 원본을 보낸다
  c.toBlob((b) => { if (b) { closeCamera(); setPhoto(b); } }, "image/jpeg", 0.92);
});

/* ---------- 릴 연출 ---------- */
function startReel(i) {
  const el = faceEls[i], pool = reelPools[reelNames[i]];
  el.classList.remove("idle", "locked");
  el.classList.add("spinning");
  clearInterval(timers[i]);
  timers[i] = setInterval(() => {
    el.textContent = pool[Math.floor(Math.random() * pool.length)];
    el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
  }, 80);
}
function stopReel(i, label) {
  const el = faceEls[i];
  clearInterval(timers[i]);
  el.classList.remove("spinning", "tick");
  el.textContent = label;
  el.classList.remove("locked"); void el.offsetWidth; el.classList.add("locked");
}
function resetReels() {
  faceEls.forEach((el, i) => {
    clearInterval(timers[i]);
    el.classList.remove("spinning", "tick", "locked");
    el.classList.add("idle");
    el.textContent = "?";
  });
}

/* ---------- 돌리기 ---------- */
async function spin() {
  if (busy || !photo || !consent.checked) return;
  busy = true; refreshUI();
  hideError(); resultEl.classList.remove("on");
  reelNames.forEach((_, i) => startReel(i));
  const t0 = performance.now();
  try {
    const fd = new FormData();
    fd.append("photo", photo, "photo.jpg");
    let res;
    try { res = await fetch("/api/spin", { method: "POST", body: fd }); }
    catch (_) { throw new Error("서버에 연결하지 못했어요. 네트워크를 확인해주세요."); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "문제가 생겼어요. 잠시 후 다시 시도해주세요.");

    await sleep(Math.max(0, 1800 - (performance.now() - t0)));   // 최소 회전 시간
    for (let i = 0; i < reelNames.length; i++) {
      stopReel(i, data.attrs[reelNames[i]]);
      await sleep(450);                                           // 왼쪽부터 순차 정지
    }
    showResult(data);
  } catch (e) {
    resetReels();
    showError(e.message);
  } finally {
    busy = false; refreshUI();
  }
}

function showResult(data) {
  beforeImg.src = photoURL;
  afterImg.src = data.image;
  tagsEl.replaceChildren(...reelNames.map((n) => {
    const t = document.createElement("span");
    t.className = "tag"; t.textContent = data.attrs[n];
    return t;
  }));
  resultEl.classList.add("on");
  resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------- 저장 (AI 표시 삽입) ---------- */
async function download() {
  const img = new Image();
  img.src = afterImg.src;
  await img.decode();
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const fs = Math.max(14, Math.round(c.width / 38));
  const text = "AI GENERATED · FACE.SLOT";
  ctx.font = `${fs}px monospace`;
  const pad = fs * 0.6, w = ctx.measureText(text).width;
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(c.width - w - pad * 2, c.height - fs - pad * 2, w + pad * 2, fs + pad * 2);
  ctx.fillStyle = "#39ff88"; ctx.textBaseline = "middle";
  ctx.fillText(text, c.width - w - pad, c.height - fs / 2 - pad);
  c.toBlob((b) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "face-slot.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, "image/png");
}

/* ---------- UI 상태 ---------- */
function refreshUI() {
  const ready = !!photo && consent.checked && !busy;
  spinBtn.disabled = !ready;
  spinBtn.textContent = busy ? "돌아가는 중…" : "얼굴 랜덤 돌리기";
  if (busy) hint.textContent = "이미지 생성에 10~20초 정도 걸려요. 릴이 멈출 때까지 기다려주세요.";
  else if (!photo) hint.textContent = "사진을 고르고 동의에 체크하면 버튼이 켜집니다.";
  else if (!consent.checked) hint.textContent = "동의에 체크하면 버튼이 켜집니다.";
  else hint.textContent = "준비 완료. 레버를 당기세요.";
}
function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
function hideError() { errorEl.style.display = "none"; }

consent.addEventListener("change", refreshUI);
spinBtn.addEventListener("click", spin);
againBtn.addEventListener("click", spin);
dlBtn.addEventListener("click", download);
window.addEventListener("pagehide", closeCamera);

init();
</script>
</body>
</html>
